name: Obmer
options:
  bundleIdPrefix: app.obmer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Obmer:
    type: application
    platform: iOS
    sources:
      - path: Obmer
    settings:
      base:
        PRODUCT_NAME: Обмер
        PRODUCT_BUNDLE_IDENTIFIER: app.obmer.scanner
        INFOPLIST_FILE: Obmer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
